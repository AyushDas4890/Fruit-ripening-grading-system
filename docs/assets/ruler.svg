<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Animated ripeness ruler: the grade equals the number of yes answers to grade &gt; 0, &gt; 1, &gt; 2">
  <style>
    .t { font: 900 26px Georgia, serif; fill: #1A1A1A; }
    .h { font: 20px 'Segoe Print', 'Comic Sans MS', cursive; fill: #4A4642; }
    .m { font: 600 17px Consolas, 'Courier New', monospace; fill: #1A1A1A; }
  </style>
  <!-- one 8 s loop; the pointer rests on each grade and the matching questions turn green.
       key times: grade 0 [0-.18], 1 [.25-.43], 2 [.5-.68], 3 [.75-.93] -->
  <rect width="960" height="300" rx="16" fill="#FAF6EF"/>
  <text class="h" x="40" y="40">the ordinal head asks 3 yes/no questions · grade = number of “yes”</text>

  <g transform="translate(60 70)">
    <rect x="0" y="34" width="780" height="20" rx="10" fill="#A9D18E" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="195" y="37" width="195" height="14" fill="#F9E07F"/><rect x="390" y="37" width="195" height="14" fill="#F07CA0"/><rect x="585" y="37" width="192" height="14" rx="6" fill="#8C6A4F"/>
    <g class="t"><text x="-8" y="22">0</text><text x="252" y="22">1</text><text x="512" y="22">2</text><text x="772" y="22">3</text></g>
    <g class="h"><text x="-20" y="84">unripe</text><text x="200" y="84">partially ripe</text><text x="495" y="84">ripe</text><text x="745" y="84">rotten</text></g>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="0 0;0 0;260 0;260 0;520 0;520 0;780 0;780 0;0 0" keyTimes="0;.18;.25;.43;.5;.68;.75;.93;1"
        calcMode="spline" keySplines=".6 0 .3 1;.6 0 .3 1;.6 0 .3 1;.6 0 .3 1;.6 0 .3 1;.6 0 .3 1;.6 0 .3 1;.6 0 .3 1"/>
      <path d="M0 98 C -12 112, 10 124, 0 140" fill="none" stroke="#EC0B9C" stroke-width="4" stroke-dasharray="7 6"/>
      <path d="M-10 108 L0 94 L10 108" fill="none" stroke="#EC0B9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(60 225)">
    <rect x="0" y="0" width="190" height="52" rx="6" fill="#FFFDF6" stroke="#1A1A1A" stroke-width="2.5">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" values="#FFFDF6;#C3EBE2;#FFFDF6" keyTimes="0;.22;.96"/>
    </rect><text class="m" x="22" y="32">grade &gt; 0 ?</text>
    <rect x="215" y="0" width="190" height="52" rx="6" fill="#FFFDF6" stroke="#1A1A1A" stroke-width="2.5">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" values="#FFFDF6;#C3EBE2;#FFFDF6" keyTimes="0;.47;.96"/>
    </rect><text class="m" x="237" y="32">grade &gt; 1 ?</text>
    <rect x="430" y="0" width="190" height="52" rx="6" fill="#FFFDF6" stroke="#1A1A1A" stroke-width="2.5">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" values="#FFFDF6;#C3EBE2;#FFFDF6" keyTimes="0;.72;.96"/>
    </rect><text class="m" x="452" y="32">grade &gt; 2 ?</text>
    <g class="t" transform="translate(650 36)">
      <text opacity="1">= 0 yes → unripe<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;.22;.96"/></text>
      <text opacity="0">= 1 yes → partially<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;.22;.47"/></text>
      <text opacity="0">= 2 yes → ripe<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;.47;.72"/></text>
      <text opacity="0">= 3 yes → rotten<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;.72;.96"/></text>
    </g>
  </g>
</svg>
